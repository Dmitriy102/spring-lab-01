spring.application.name=spring-lab-01
server.port=8080
app.owner=Boba Ameba, IS-1666
logging.level.web=INFO

# --- НАСТРОЙКИ ПОДКЛЮЧЕНИЯ К ПОСТГРЕСУ ---
spring.datasource.url=jdbc:postgresql://localhost:5432/springlab
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Меняем validate на update, чтобы таблицы создались автоматически!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Отключим пока строгий Flyway, чтобы он не конфликтовал с контейнером
spring.flyway.enabled=false